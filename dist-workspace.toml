[workspace]
members = ["cargo:."]

# Config for `dist` (cargo-dist): on every vX.Y.Z tag, build every target
# below, publish a GitHub release with shell / PowerShell / MSI installers,
# and push a formula to the Homebrew tap. The tag is pushed by
# .github/workflows/tag-on-merge.yml when a PR is merged.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# A GitHub repo to push Homebrew formulas to (needs the HOMEBREW_TAP_TOKEN secret)
tap = "charalamposlamprou/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# dist 0.30.0 defaults macOS builds to macos-13, an image GitHub has retired.
# macos-14 is Apple Silicon and cross-builds x86_64-apple-darwin natively.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"
