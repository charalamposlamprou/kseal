[workspace]
members = ["cargo:."]

# Config for `dist` (cargo-dist): for each vX.Y.Z release, build every target
# below and publish a GitHub release with shell / PowerShell / MSI installers
# and a Homebrew formula. .github/workflows/tag-on-merge.yml pushes the tag
# and dispatches release.yml when a PR is merged.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Publish jobs to run in CI. The Homebrew formula is committed to THIS repo
# (Formula/kseal.rb) by our own job, using the built-in GITHUB_TOKEN — so no
# personal token is needed. Users: brew tap charalamposlamprou/kseal <repo url>
publish-jobs = ["./publish-homebrew"]
# Releases are started by tag-on-merge.yml via workflow_dispatch (a tag pushed
# with GITHUB_TOKEN can't trigger a workflow; a dispatch can).
dispatch-releases = true
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# dist 0.30.0 defaults macOS builds to macos-13, an image GitHub has retired.
# macos-14 is Apple Silicon and cross-builds x86_64-apple-darwin natively.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"

# The Homebrew job commits Formula/kseal.rb to this repo, so it needs to push.
[dist.github-custom-job-permissions]
"publish-homebrew" = { contents = "write" }
