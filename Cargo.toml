[package]
name = "kseal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal UI + CLI for Kubernetes Secrets: base64 encode/decode, .env → Secret YAML, and native SealedSecret sealing — read-only against the cluster."
license = "MIT"
repository = "https://github.com/charalamposlamprou/kseal"
homepage = "https://github.com/charalamposlamprou/kseal"
readme = "README.md"
keywords = ["kubernetes", "secrets", "sealed-secrets", "tui", "base64"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

# Sealing (kubeseal-compatible hybrid RSA-OAEP + AES-256-GCM)
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
x509-parser = "0.16"

# Cluster access (read-only) — rustls so release binaries are fully static
kube = { version = "4", default-features = false, features = ["client", "config", "rustls-tls", "ring", "oidc", "http-proxy"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
http = "1"

# TUI
ratatui = "0.30"
crossterm = "0.29"
arboard = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The config file for `dist` (cargo-dist): builds every target below on each
# vX.Y.Z tag, publishes a GitHub release with shell/PowerShell installers, and
# pushes a formula to the Homebrew tap.
[profile.dist]
inherits = "release"

[package.metadata.dist]
cargo-dist-version = "0.30.0"
ci = "github"
installers = ["shell", "powershell", "homebrew", "msi"]
tap = "charalamposlamprou/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
