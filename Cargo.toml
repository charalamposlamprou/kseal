[package]
name = "kseal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "TUI and CLI for Kubernetes Secrets, with native SealedSecret sealing"
authors = ["Charalampos Lamprou"]
license = "MIT"
repository = "https://github.com/charalamposlamprou/kseal"
homepage = "https://github.com/charalamposlamprou/kseal"
readme = "README.md"
keywords = ["kubernetes", "secrets", "sealed-secrets", "tui", "base64"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

# Sealing (kubeseal-compatible hybrid RSA-OAEP + AES-256-GCM)
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
x509-parser = "0.16"

# Cluster access (read-only) — rustls so release binaries are fully static
kube = { version = "4", default-features = false, features = ["client", "config", "rustls-tls", "ring", "oidc", "http-proxy"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
http = "1"

# TUI
ratatui = "0.30"
crossterm = "0.29"
arboard = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[package.metadata.wix]
upgrade-guid = "A605AC27-5D2E-4D4E-A372-71710673D163"
path-guid = "9C68C058-DAC6-4857-9C17-164D3DC0FF44"
license = false
eula = false
