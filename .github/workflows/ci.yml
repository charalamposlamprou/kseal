name: CI

# Lint and test on every PR (and pushes to main). Make the jobs required
# status checks in branch protection so a PR can't merge until they pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the KinD + sealed-secrets end-to-end test
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The sealing interop test decrypts with Go's crypto/rsa + crypto/cipher,
      # the primitives sealed-secrets itself uses.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
      # Per OS, because unix/windows code paths differ. clippy.toml bans the
      # mutating kube::Api methods: kseal stays read-only against the cluster.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
        env:
          KSEAL_REQUIRE_GO: "1"

  # Opt-in: a throwaway KinD cluster with the real sealed-secrets controller.
  # Runs on manual dispatch (tick "e2e") or on PRs labelled `e2e`.
  e2e:
    name: e2e (KinD + sealed-secrets)
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.e2e) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: scripts/e2e-kind.sh
